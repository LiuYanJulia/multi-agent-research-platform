<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1500" viewBox="0 0 2400 1500" role="img" aria-labelledby="title desc">
  <title id="title">Real-time analysis and adaptive guidance architecture</title>
  <desc id="desc">A research-platform architecture showing raw interaction, speech, and chat data becoming a timeline, design-move and orientation analysis, deterministic experimental control, adaptive guidance, ordinary AI response, and an audit trail.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#4a88a7"/></marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#dd7828"/></marker>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#5c963d"/></marker>
    <marker id="arrow-purple" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#a64d80"/></marker>
    <style>
      .hand { font-family: 'Chalkboard SE','Comic Sans MS',sans-serif; font-weight: 700; fill: #333; }
      .body { font-family: Arial,sans-serif; fill: #414141; }
      .muted { font-family: Arial,sans-serif; fill: #505050; }
      .tiny { font-family: Arial,sans-serif; fill: #505050; font-size: 25px; }
      .flow-blue { fill: none; stroke: #4a88a7; stroke-width: 7; marker-end: url(#arrow-blue); }
      .flow-orange { fill: none; stroke: #dd7828; stroke-width: 7; marker-end: url(#arrow-orange); }
      .flow-green { fill: none; stroke: #5c963d; stroke-width: 7; marker-end: url(#arrow-green); }
      .flow-purple { fill: none; stroke: #a64d80; stroke-width: 6; stroke-dasharray: 14 12; marker-end: url(#arrow-purple); }
    </style>
  </defs>

  <text x="85" y="100" class="hand" font-size="58">REAL-TIME ANALYSIS + ADAPTIVE GUIDANCE</text>
  <text x="88" y="148" class="muted" font-size="30">How multimodal participant activity becomes auditable experimental intervention</text>
  <line x1="85" y1="182" x2="2315" y2="182" stroke="#777" stroke-width="3"/>

  <!-- visual key -->
  <g transform="translate(85 215)">
    <text x="0" y="28" class="hand" font-size="26">KEY</text>
    <rect x="90" y="2" width="32" height="32" rx="8" fill="#edf6fb" stroke="#4a88a7" stroke-width="3"/><text x="134" y="28" class="tiny">data + LLM analysis</text>
    <rect x="430" y="2" width="32" height="32" rx="8" fill="#fff1e6" stroke="#dd7828" stroke-width="3"/><text x="474" y="28" class="tiny">deterministic policy</text>
    <rect x="770" y="2" width="32" height="32" rx="8" fill="#eff8e9" stroke="#5c963d" stroke-width="3"/><text x="814" y="28" class="tiny">stored output + delivery</text>
    <rect x="1164" y="2" width="32" height="32" rx="8" fill="#fff0f7" stroke="#a64d80" stroke-width="3"/><text x="1208" y="28" class="tiny">optional D/C path</text>
  </g>

  <!-- Phase labels -->
  <text x="85" y="350" class="hand" font-size="30">PHASE 1: CAPTURE + ALIGN</text>
  <text x="1025" y="350" class="hand" font-size="30">PHASE 2: INTERPRET THE TURN</text>
  <text x="1690" y="350" class="hand" font-size="30">PHASE 3: APPLY POLICY + DELIVER</text>

  <!-- Inputs -->
  <g transform="translate(85 395)">
    <rect width="360" height="160" rx="24" fill="#edf6fb" stroke="#4a88a7" stroke-width="4"/>
    <text x="180" y="61" text-anchor="middle" class="hand" font-size="34">Interaction Logs</text>
    <text x="180" y="106" text-anchor="middle" class="body" font-size="25">canvas / editor actions</text>
    <text x="180" y="138" text-anchor="middle" class="muted" font-size="21">typed, pasted, moved, viewed</text>
  </g>
  <g transform="translate(85 620)">
    <rect width="360" height="160" rx="24" fill="#edf6fb" stroke="#4a88a7" stroke-width="4"/>
    <text x="180" y="61" text-anchor="middle" class="hand" font-size="34">Speech Segments</text>
    <text x="180" y="106" text-anchor="middle" class="body" font-size="25">timestamped transcripts</text>
    <text x="180" y="138" text-anchor="middle" class="muted" font-size="21">merged and filler-filtered</text>
  </g>
  <g transform="translate(85 845)">
    <rect width="360" height="160" rx="24" fill="#edf6fb" stroke="#4a88a7" stroke-width="4"/>
    <text x="180" y="61" text-anchor="middle" class="hand" font-size="34">Chat Messages</text>
    <text x="180" y="106" text-anchor="middle" class="body" font-size="25">user prompt + AI context</text>
    <text x="180" y="138" text-anchor="middle" class="muted" font-size="21">saved when Send is pressed</text>
  </g>

  <!-- Timeline builder -->
  <g transform="translate(550 545)">
    <rect width="400" height="330" rx="28" fill="#edf6fb" stroke="#4a88a7" stroke-width="5"/>
    <text x="200" y="64" text-anchor="middle" class="hand" font-size="39">Event Timeline</text>
    <text x="200" y="109" text-anchor="middle" class="hand" font-size="39">Builder</text>
    <line x1="48" y1="139" x2="352" y2="139" stroke="#777" stroke-width="3"/>
    <text x="200" y="183" text-anchor="middle" class="body" font-size="26">normalise timestamps</text>
    <text x="200" y="222" text-anchor="middle" class="body" font-size="26">clean + deduplicate events</text>
    <text x="200" y="261" text-anchor="middle" class="body" font-size="26">order one behavioural timeline</text>
    <text x="200" y="303" text-anchor="middle" class="muted" font-size="21">stored as session_events</text>
  </g>

  <!-- Partition -->
  <g transform="translate(1025 460)">
    <rect width="470" height="180" rx="24" fill="#edf6fb" stroke="#4a88a7" stroke-width="4"/>
    <text x="235" y="61" text-anchor="middle" class="hand" font-size="35">Closed User-Turn Partition</text>
    <text x="235" y="107" text-anchor="middle" class="body" font-size="24">from previous user message to current Send</text>
    <text x="235" y="143" text-anchor="middle" class="muted" font-size="21">interaction + speech + current user message</text>
  </g>

  <!-- Evaluation agent -->
  <g transform="translate(1025 730)">
    <rect width="470" height="310" rx="28" fill="#edf6fb" stroke="#4a88a7" stroke-width="5"/>
    <rect x="175" y="-22" width="120" height="45" rx="15" fill="#fff" stroke="#8a8a8a" stroke-width="3" stroke-dasharray="8 6"/>
    <text x="235" y="9" text-anchor="middle" class="hand" font-size="22">FINE-TUNED</text>
    <text x="235" y="75" text-anchor="middle" class="hand" font-size="38">Evaluation Agent</text>
    <line x1="55" y1="105" x2="415" y2="105" stroke="#777" stroke-width="3"/>
    <text x="235" y="150" text-anchor="middle" class="body" font-size="25">code the sequential design moves</text>
    <text x="235" y="191" text-anchor="middle" class="body" font-size="24">Explore · Ask · Generate</text>
    <text x="235" y="226" text-anchor="middle" class="body" font-size="24">Evaluate · Respond · Execute</text>
    <text x="235" y="275" text-anchor="middle" class="muted" font-size="21">validate counts · retry / fallback when needed</text>
  </g>

  <!-- Decision agent optional -->
  <g transform="translate(1025 1115)">
    <rect width="470" height="185" rx="24" fill="#fff0f7" stroke="#a64d80" stroke-width="4"/>
    <rect x="142" y="-22" width="186" height="45" rx="15" fill="#fff" stroke="#8a8a8a" stroke-width="3" stroke-dasharray="8 6"/>
    <text x="235" y="9" text-anchor="middle" class="hand" font-size="22">OPTIONAL EXPERIMENT</text>
    <text x="235" y="70" text-anchor="middle" class="hand" font-size="35">Decision Agent</text>
    <text x="235" y="112" text-anchor="middle" class="body" font-size="24">independently classify D / C orientation</text>
    <text x="235" y="150" text-anchor="middle" class="muted" font-size="21">can replace the default move-type mapping</text>
  </g>

  <!-- ledger -->
  <g transform="translate(1570 730)">
    <rect width="380" height="230" rx="26" fill="#eff8e9" stroke="#5c963d" stroke-width="5"/>
    <path d="M39 36h55l22 22v88H39z" fill="#ffcf73" stroke="#d99c2f" stroke-width="3"/>
    <path d="M94 36v24h22" fill="none" stroke="#d99c2f" stroke-width="3"/>
    <text x="57" y="103" class="body" font-size="20" font-weight="700" fill="#fff">LOG</text>
    <text x="239" y="73" text-anchor="middle" class="hand" font-size="35">Move Ledger</text>
    <text x="239" y="118" text-anchor="middle" class="body" font-size="24">moves + D/C orientation</text>
    <text x="239" y="157" text-anchor="middle" class="body" font-size="24">turn + event provenance</text>
    <text x="190" y="202" text-anchor="middle" class="muted" font-size="21">full sequential record</text>
  </g>

  <!-- Controller -->
  <g transform="translate(2025 525)">
    <rect width="310" height="345" rx="28" fill="#fff1e6" stroke="#dd7828" stroke-width="5"/>
    <rect x="63" y="-22" width="184" height="45" rx="15" fill="#fff" stroke="#707070" stroke-width="3"/>
    <text x="155" y="9" text-anchor="middle" class="hand" font-size="22">DETERMINISTIC</text>
    <text x="155" y="70" text-anchor="middle" class="hand" font-size="34">Manipulation</text>
    <text x="155" y="110" text-anchor="middle" class="hand" font-size="34">Controller</text>
    <line x1="42" y1="138" x2="268" y2="138" stroke="#777" stroke-width="3"/>
    <text x="155" y="180" text-anchor="middle" class="body" font-size="23">group condition</text>
    <text x="155" y="217" text-anchor="middle" class="body" font-size="23">D/C streak rule</text>
    <text x="155" y="254" text-anchor="middle" class="body" font-size="23">target orientation</text>
    <text x="155" y="306" text-anchor="middle" class="muted" font-size="20">transparent + reproducible</text>
  </g>

  <!-- Trigger decision + outputs -->
  <g transform="translate(2045 1010)">
    <path d="M145 0L285 105L145 210L5 105Z" fill="#fff6cb" stroke="#af8924" stroke-width="5"/>
    <text x="145" y="87" text-anchor="middle" class="hand" font-size="31">Policy</text>
    <text x="145" y="124" text-anchor="middle" class="hand" font-size="31">Trigger?</text>
    <text x="145" y="158" text-anchor="middle" class="muted" font-size="19">intervene or remain silent</text>
  </g>
  <g transform="translate(1650 1280)">
    <rect width="410" height="145" rx="24" fill="#eff8e9" stroke="#5c963d" stroke-width="4"/>
    <text x="205" y="56" text-anchor="middle" class="hand" font-size="31">Adaptive Guidance</text>
    <text x="205" y="98" text-anchor="middle" class="body" font-size="23">condition-specific D / C prompt</text>
    <text x="205" y="128" text-anchor="middle" class="muted" font-size="19">saved as a distinct guidance message</text>
  </g>
  <g transform="translate(80 1165)">
    <rect width="720" height="210" rx="26" fill="#eff8e9" stroke="#5c963d" stroke-width="5"/>
    <text x="360" y="62" text-anchor="middle" class="hand" font-size="35">Research Audit Trail</text>
    <line x1="55" y1="88" x2="665" y2="88" stroke="#777" stroke-width="3"/>
    <text x="360" y="132" text-anchor="middle" class="body" font-size="25">session timeline · move ledger · policy decision</text>
    <text x="360" y="170" text-anchor="middle" class="body" font-size="25">per-agent input / output · model · timing · retries</text>
  </g>
  <g transform="translate(880 1330)">
    <rect width="550" height="95" rx="22" fill="#eff8e9" stroke="#5c963d" stroke-width="4"/>
    <text x="275" y="43" text-anchor="middle" class="hand" font-size="29">Main Response Agent</text>
    <text x="275" y="75" text-anchor="middle" class="body" font-size="21">ordinary chatbot reply continues separately</text>
  </g>

  <!-- Connectors: inputs into timeline -->
  <path d="M445 475 H510 V660 H550" class="flow-blue"/>
  <path d="M445 700 H550" class="flow-blue"/>
  <path d="M445 925 H510 V760 H550" class="flow-blue"/>
  <path d="M950 710 H990 V550 H1025" class="flow-blue"/>
  <path d="M1260 640 V700" class="flow-blue"/>
  <path d="M1495 885 H1570" class="flow-green"/>
  <path d="M1495 1210 H1540 V930 H1570" class="flow-purple"/>
  <path d="M1950 845 H2025" class="flow-orange"/>
  <path d="M2180 870 V990" class="flow-orange"/>
  <path d="M2072 1150 L1890 1280" class="flow-green"/>
  <text x="1930" y="1205" class="hand" font-size="27" fill="#5c963d">YES</text>
  <path d="M2045 1115 H1450 V1375 H1430" class="flow-green"/>
  <text x="1805" y="1090" class="hand" font-size="27" fill="#5c963d">NO</text>
  <path d="M860 1115 V1165" class="flow-green"/>
  <path d="M1210 1040 V1285 H1160 V1330" class="flow-green"/>
  <path d="M1880 1425 V1460 H440 V1375" class="flow-green"/>

  <!-- Annotation -->
  <g transform="translate(1515 465)">
    <rect width="390" height="120" rx="20" fill="#fff" stroke="#8a8a8a" stroke-width="3" stroke-dasharray="8 6"/>
    <text x="195" y="43" text-anchor="middle" class="hand" font-size="25">Design principle</text>
    <text x="195" y="79" text-anchor="middle" class="body" font-size="20">LLMs interpret behaviour;</text>
    <text x="195" y="106" text-anchor="middle" class="body" font-size="20">code enforces treatment policy.</text>
  </g>
</svg>

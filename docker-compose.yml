version: '3.8'

services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: research-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: research_platform
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - research-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: research-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: db
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: research_platform
      FRONTEND_URL: ${FRONTEND_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      EVAL_MODEL_ID: ${EVAL_MODEL_ID}
      GUIDANCE_GENERATION_MODE: ${GUIDANCE_GENERATION_MODE:-llm}
      GUIDANCE_MODEL_ID: ${GUIDANCE_MODEL_ID:-gpt-5.6-terra}
      OPENAI_REALTIME_MODEL: ${OPENAI_REALTIME_MODEL:-gpt-live-transcribe}
      OPENAI_REALTIME_URL: ${OPENAI_REALTIME_URL:-wss://api.openai.com/v1/realtime}
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - research-network

  # Frontend (Nginx serving React build)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: research-frontend
    restart: always
    volumes:
      - frontend-build:/usr/share/nginx/html
    depends_on:
      - backend
    networks:
      - research-network

  # Nginx SSL reverse proxy (serves both frontend and backend)
  nginx-ssl:
    image: nginx:alpine
    container_name: research-nginx-ssl
    restart: always
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ${NGINX_CONFIG:-./nginx-ssl.conf}:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - frontend-build:/usr/share/nginx/html:ro
    depends_on:
      - backend
      - frontend
    networks:
      - research-network

volumes:
  db-data:
    driver: local
  frontend-build:
    driver: local

networks:
  research-network:
    driver: bridge
